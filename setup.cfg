# CI / local tooling defaults for the public UMLENR tree.
# Legacy inventory is soft-excluded from lint/collection until archived or given a real suite.

[flake8]
max-line-length = 127
max-complexity = 10
exclude =
    LENR_ARA_GPT,
    venv,
    .venv,
    node_modules,
    .git,
    .specstory

[tool:pytest]
norecursedirs =
    LENR_ARA_GPT
    LENR_Math_Sim
    venv
    .venv
    node_modules
    .git
    .specstory
    .github
